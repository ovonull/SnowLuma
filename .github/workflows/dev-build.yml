name: Dev Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

# Only `dev` gets a shared, self-cancelling group so a newer dev commit
# supersedes the in-flight one (and its Docker dispatch) before it publishes.
# Every other branch falls back to a unique per-run group (github.run_id), so
# their concurrency behavior is unchanged — no shared-group pending-run
# replacement, no accidental serialization.
concurrency:
  group: ${{ github.ref == 'refs/heads/dev' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # Delete only artifacts older than 24h. The dev Docker hand-off relies on
      # this run's fresh `snowluma-dev-docker-*` artifact still existing when the
      # downstream (cross-repo) Docker build downloads it; a blanket "delete all"
      # here — which also runs on every other branch's push — could race-delete
      # an in-flight hand-off artifact. Age-gating keeps recent ones safe while
      # still reaping the backlog.
      - name: Delete old artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            // Collect every artifact first, THEN delete — deleting mid-pagination
            // shifts the list and would skip ~a page of old artifacts per delete.
            const all = [];
            let page = 1;
            while (true) {
              const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              if (artifacts.length === 0) break;
              all.push(...artifacts);
              page++;
            }
            for (const artifact of all) {
              if (new Date(artifact.created_at).getTime() >= cutoff) {
                continue; // keep recent artifacts (may be in-flight dev hand-offs)
              }
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name}`);
            }

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs `tsc --noEmit` (or `tsc -b`) in every workspace package that
      # exposes a `typecheck` script. Platform-independent, so a single
      # ubuntu runner is sufficient.
      - name: Type check all packages
        run: pnpm typecheck

  build:
    needs: [cleanup, typecheck]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            os: windows-latest
            target: win32-x64
          - name: linux-x64
            os: ubuntu-latest
            target: linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native smoke tests
        run: pnpm test:native

      # Always builds the WebUI flavor — no separate "core-only" artifact.
      - name: Build project
        env:
          SNOWLUMA_TARGET: ${{ matrix.target }}
        run: pnpm run build:all

      - name: Verify release layout
        run: pnpm check:release-layout

      # Naming convention:
      #   SnowLuma-dev-<arch>.zip|tar.gz        – zero-install (node bundled)
      #   SnowLuma-dev-<arch>-lite.zip|tar.gz   – user provides Node ^24.22.1 or >=26.12.1
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "SnowLuma-dev-${{ matrix.name }}-lite.zip"
          Copy-Item (Get-Command node).Source -Destination "dist\node.exe"
          Compress-Archive -Path "dist\*" -DestinationPath "SnowLuma-dev-${{ matrix.name }}.zip"

      - name: Package (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          chmod +x dist/launcher.sh
          tar -czf "SnowLuma-dev-${{ matrix.name }}-lite.tar.gz" -C dist .
          cp "$(command -v node)" dist/node
          chmod +x dist/node
          tar -czf "SnowLuma-dev-${{ matrix.name }}.tar.gz" -C dist .

      # Single upload step — glob picks up both variants (.zip on Windows,
      # .tar.gz on Linux) for this matrix row.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnowLuma-dev-${{ github.sha }}-${{ matrix.name }}
          path: SnowLuma-dev-${{ matrix.name }}*
          retention-days: 3
          overwrite: true
          if-no-files-found: error

  # Dev Build 直接在仓库内构建多架构镜像并推送 Docker Hub。
  # 不依赖上游跨仓库构建。镜像名从仓库变量 vars.DOCKER_IMAGE 读取（当前 ovonull/snowluma），
  # 改镜像名只需在 Settings > Variables 改 DOCKER_IMAGE，不必动 workflow。登录仍用
  # secrets.DOCKERHUB_USERNAME/TOKEN 的令牌，需对镜像所在组织有写权限，tag=dev。
  # 需配 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN。
  docker:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download linux-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: SnowLuma-dev-${{ github.sha }}-linux-x64
          path: dist

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: SnowLuma-dev-${{ github.sha }}-linux-arm64
          path: dist

      - name: Keep only full tarballs
        run: rm -f dist/*-lite.tar.gz

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE }}:dev
