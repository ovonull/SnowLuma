name: Build Docker Image

# 给「已有 GitHub Release 的版本」补构建 Docker 镜像用：手动触发，填版本号即可。
# 不重跑测试/打包，也不动 tag；镜像直接从对应版本的发版包构建。
# 例如填 v2.4.2，会推 ovonull/snowluma:v2.4.2 与 ovonull/snowluma:latest。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '已有发版 tag，例如 v2.4.2（镜像将打该版本号标签与 latest）'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SNOWLUMA_VERSION=${{ github.event.inputs.version }}
          tags: |
            ${{ vars.DOCKER_IMAGE }}:${{ github.event.inputs.version }}
            ${{ vars.DOCKER_IMAGE }}:latest
